# Formula registry for the physics solver.
# Each entry is consumed by exact_agent.physics.formula_library.FormulaLibrary.
# `inputs` and `output` declare the symbols & SI base units the solver will
# canonicalize to via pint before substitution. `expression` is parsed by SymPy.

formulas:
  capacitor_energy:
    topic: TD
    description: "Energy stored in a capacitor: E = 0.5·C·U²"
    inputs:
      C: { unit: "farad", aliases: ["capacitance"] }
      U: { unit: "volt",  aliases: ["voltage", "V"] }
    output:
      symbol: E
      unit: "joule"
    expression: "0.5 * C * U**2"

  # Iter-5 Fix C (TD361): "A capacitor has a charge of 40 μC and a voltage
  # of 8 V. Calculate the energy stored." Question gives Q and U but never
  # mentions C explicitly, so capacitor_energy fails with missing_input='C'.
  # Use the algebraically equivalent E = Q·U/2 form.
  capacitor_energy_from_charge_voltage:
    topic: TD
    description: "Energy stored in a capacitor expressed via charge: E = 0.5·Q·U"
    inputs:
      Q: { unit: "coulomb", aliases: ["charge", "q"] }
      U: { unit: "volt",    aliases: ["voltage", "V"] }
    output:
      symbol: E
      unit: "joule"
    expression: "0.5 * Q * U"

  capacitance_from_charge:
    topic: TD
    description: "Capacitance from charge and voltage: C = Q/U"
    inputs:
      Q: { unit: "coulomb", aliases: ["charge"] }
      U: { unit: "volt",    aliases: ["voltage", "V"] }
    output:
      symbol: C
      unit: "farad"
    expression: "Q / U"

  charge_from_capacitance:
    topic: TD
    description: "Charge on a capacitor: Q = C·U"
    inputs:
      C: { unit: "farad", aliases: ["capacitance"] }
      U: { unit: "volt",  aliases: ["voltage", "V"] }
    output:
      symbol: Q
      unit: "coulomb"
    expression: "C * U"

  voltage_from_energy_capacitance:
    topic: NL
    description: "Voltage of a capacitor from energy and capacitance: U = sqrt(2W/C)"
    inputs:
      W: { unit: "joule", aliases: ["energy", "E"] }
      C: { unit: "farad", aliases: ["capacitance"] }
    output:
      symbol: U
      unit: "volt"
    expression: "sqrt(2 * W / C)"

  capacitance_from_energy_voltage:
    topic: NL
    description: "Capacitance from stored energy and voltage: C = 2W/U^2"
    inputs:
      W: { unit: "joule", aliases: ["energy", "E"] }
      U: { unit: "volt",  aliases: ["voltage", "V"] }
    output:
      symbol: C
      unit: "farad"
    expression: "2 * W / U**2"

  coulomb_force:
    topic: LD
    description: "Coulomb force between two point charges: F = k·|q1·q2|/r²"
    inputs:
      q1: { unit: "coulomb" }
      q2: { unit: "coulomb" }
      r:  { unit: "meter",   aliases: ["distance", "d"] }
    output:
      symbol: F
      unit: "newton"
    expression: "8.9875517923e9 * Abs(q1*q2) / r**2"

  electric_field_point_charge:
    topic: DT
    description: "Electric field of a point charge: E = k·q/r²"
    inputs:
      q: { unit: "coulomb" }
      r: { unit: "meter",   aliases: ["distance"] }
    output:
      symbol: E
      unit: "volt/meter"
    expression: "8.9875517923e9 * q / r**2"

  ohm_law_voltage:
    topic: CH
    description: "Ohm's law: V = I·R"
    inputs:
      I: { unit: "ampere",  aliases: ["current"] }
      R: { unit: "ohm",     aliases: ["resistance"] }
    output:
      symbol: V
      unit: "volt"
    expression: "I * R"

  power_voltage_current:
    topic: NL
    description: "Electric power: P = U·I"
    inputs:
      U: { unit: "volt",   aliases: ["voltage", "V"] }
      I: { unit: "ampere", aliases: ["current"] }
    output:
      symbol: P
      unit: "watt"
    expression: "U * I"

  power_i2r:
    topic: NL
    description: "Joule heating: P = I²·R"
    inputs:
      I: { unit: "ampere",  aliases: ["current"] }
      R: { unit: "ohm",     aliases: ["resistance"] }
    output:
      symbol: P
      unit: "watt"
    expression: "I**2 * R"

  series_resistance_two:
    topic: CH
    description: "Two resistors in series: R = R1 + R2"
    inputs:
      R1: { unit: "ohm" }
      R2: { unit: "ohm" }
    output:
      symbol: R
      unit: "ohm"
    expression: "R1 + R2"

  parallel_resistance_two:
    topic: CH
    description: "Two resistors in parallel: 1/R = 1/R1 + 1/R2"
    inputs:
      R1: { unit: "ohm" }
      R2: { unit: "ohm" }
    output:
      symbol: R
      unit: "ohm"
    expression: "(R1 * R2) / (R1 + R2)"

  rlc_impedance:
    topic: CHLT
    description: "Series RLC impedance: Z = sqrt(R² + (X_L − X_C)²)"
    inputs:
      R:   { unit: "ohm" }
      X_L: { unit: "ohm",   aliases: ["XL"] }
      X_C: { unit: "ohm",   aliases: ["XC"] }
    output:
      symbol: Z
      unit: "ohm"
    expression: "sqrt(R**2 + (X_L - X_C)**2)"

  resonance_frequency:
    topic: CHLT
    description: "Resonance frequency of LC circuit: f0 = 1 / (2π·sqrt(LC))"
    inputs:
      L: { unit: "henry" }
      C: { unit: "farad" }
    output:
      symbol: f
      unit: "hertz"
    expression: "1 / (2 * pi * sqrt(L * C))"

  magnetic_field_solenoid:
    topic: DDT
    description: "Magnetic field inside a long solenoid: B = μ0·n·I"
    inputs:
      n: { unit: "1/meter", aliases: ["turns_per_meter"] }
      I: { unit: "ampere",  aliases: ["current"] }
    output:
      symbol: B
      unit: "tesla"
    expression: "1.25663706212e-6 * n * I"

  magnetic_field_long_wire:
    topic: DDT
    description: "Magnetic field around a long straight wire: B = μ0·I / (2π·r)"
    inputs:
      I: { unit: "ampere", aliases: ["current"] }
      r: { unit: "meter",  aliases: ["distance"] }
    output:
      symbol: B
      unit: "tesla"
    expression: "1.25663706212e-6 * I / (2 * pi * r)"

  resultant_two_forces:
    topic: LD
    description: "Resultant of two forces at an angle (law of cosines): R = sqrt(F1² + F2² + 2·F1·F2·cosθ)"
    inputs:
      F1:    { unit: "newton", aliases: ["force1", "first_force"] }
      F2:    { unit: "newton", aliases: ["force2", "second_force"] }
      theta: { unit: "degree", aliases: ["angle", "angle_between"] }
    output:
      symbol: R
      unit: "newton"
    expression: "sqrt(F1**2 + F2**2 + 2*F1*F2*cos(theta*pi/180))"

  capacitance_for_resonance:
    topic: CH
    description: "Capacitance needed for an LC circuit to resonate at frequency f: C = 1/(L·(2π·f)²)"
    inputs:
      L: { unit: "henry", aliases: ["inductance"] }
      f: { unit: "hertz", aliases: ["frequency", "resonant_frequency"] }
    output:
      symbol: C
      unit: "farad"
    expression: "1/(L*(2*pi*f)**2)"

  resonance_frequency_factor:
    topic: CH
    description: "Factor k to scale ω0 so a series RLC reaches resonance: k = sqrt(X_C/X_L)"
    inputs:
      X_L: { unit: "ohm", aliases: ["XL", "inductive_reactance"] }
      X_C: { unit: "ohm", aliases: ["XC", "capacitive_reactance"] }
    output:
      symbol: k
      unit: "dimensionless"
    expression: "sqrt(X_C/X_L)"

  resistance_at_resonance:
    topic: CH
    description: "At resonance X_L = X_C so impedance equals the pure resistance: R = Z"
    inputs:
      Z: { unit: "ohm", aliases: ["impedance"] }
    output:
      symbol: R
      unit: "ohm"
    expression: "Z"

  power_at_resonance:
    topic: CH
    description: "Power of a series RLC at resonance (Z = R): P = U²/R"
    inputs:
      U: { unit: "volt", aliases: ["voltage", "V", "rms_voltage"] }
      R: { unit: "ohm",  aliases: ["resistance"] }
    output:
      symbol: P
      unit: "watt"
    expression: "U**2/R"

  relative_error_percent:
    topic: THCB
    description: "Percentage relative error: (Δ/value)·100"
    inputs:
      delta: { unit: "dimensionless", aliases: ["absolute_error", "uncertainty", "least_count"] }
      value: { unit: "dimensionless", aliases: ["measured_value", "reading"] }
    output:
      symbol: e
      unit: "%"
    expression: "(delta/value)*100"

  current_from_inductor_energy:
    topic: NL
    description: "Current in an inductor from stored magnetic energy: I = sqrt(2·W/L)"
    inputs:
      W: { unit: "joule", aliases: ["energy", "magnetic_energy", "E"] }
      L: { unit: "henry", aliases: ["inductance"] }
    output:
      symbol: I
      unit: "ampere"
    expression: "sqrt(2*W/L)"

  coulomb_force_at_midpoint:
    topic: LD
    description: "Net Coulomb force on charge q3 at the midpoint of opposite-sign q1,q2 a distance d apart: F = 4k|q3|(|q1|+|q2|)/d²"
    inputs:
      q1: { unit: "coulomb", aliases: ["charge1"] }
      q2: { unit: "coulomb", aliases: ["charge2"] }
      q3: { unit: "coulomb", aliases: ["q", "test_charge", "charge3"] }
      d:  { unit: "meter",   aliases: ["distance", "separation", "AB"] }
    output:
      symbol: F
      unit: "newton"
    expression: "4 * 8.9875517923e9 * Abs(q3) * (Abs(q1) + Abs(q2)) / d**2"

  electric_field_two_opposite_charges_midpoint:
    topic: LD
    description: "Electric field at the midpoint M of two opposite-sign equal-magnitude charges (+q at A, −q at B, AB = d): the two fields point the same way (from + to −) and ADD → E = 8·k·|q|/d²"
    inputs:
      q: { unit: "coulomb", aliases: ["q1", "q2", "charge", "magnitude"] }
      d: { unit: "meter",   aliases: ["AB", "separation", "distance"] }
    output:
      symbol: E
      unit: "volt/meter"
    expression: "8 * 8.9875517923e9 * Abs(q) / d**2"

  # Iter-4 Fix D: 2 opposite-sign charges +q1 at A, −q2 at B with AB = d.
  # M lies on the perpendicular bisector of AB, distance l from the midpoint
  # (so MA = MB = r = sqrt((d/2)² + l²)). With opposite signs the two
  # field vectors' horizontal-from-AB components ADD and vertical components
  # subtract by |q1|−|q2|. The general magnitude is
  #   E = (k / r³) · sqrt(((|q1|+|q2|)·d/2)² + ((|q1|−|q2|)·l)²)
  # Equal-magnitude reduces to E = k·|q|·d / r³ (LD065/099/100); unequal
  # is LD340. Verified algebraically against the four pinned gold answers.
  electric_field_perp_bisector_two_opposite:
    topic: LD
    description: "Electric field at point M on the perpendicular bisector of two opposite-sign charges (+q1 at A, −q2 at B, separation d, perp distance l from midpoint): E = k·sqrt(((|q1|+|q2|)·d/2)² + ((|q1|−|q2|)·l)²) / ((d/2)² + l²)^1.5"
    inputs:
      q1: { unit: "coulomb" }
      q2: { unit: "coulomb" }
      d:  { unit: "meter",  aliases: ["AB", "separation"] }
      l:  { unit: "meter",  aliases: ["distance", "perp_distance"] }
    output:
      symbol: E
      unit: "volt/meter"
    expression: "8.9875517923e9 * sqrt(((Abs(q1)+Abs(q2))*d/2)**2 + ((Abs(q1)-Abs(q2))*l)**2) / ((d/2)**2 + l**2)**1.5"

  impedance_from_voltage_current:
    topic: CH
    description: "RLC series impedance from RMS voltage and current: Z = U/I"
    inputs:
      U: { unit: "volt",   aliases: ["voltage", "V", "rms_voltage", "source_voltage"] }
      I: { unit: "ampere", aliases: ["current", "rms_current"] }
    output:
      symbol: Z
      unit: "ohm"
    expression: "U / I"

  magnetic_flux_solenoid_one_turn:
    topic: DDT
    description: "Magnetic flux through one turn of a solenoid (or any single loop) given field B and area A: Φ = B·A"
    inputs:
      B: { unit: "tesla",     aliases: ["magnetic_field", "field_strength", "flux_density"] }
      A: { unit: "meter ** 2", aliases: ["area", "cross_section", "cross_sectional_area", "S"] }
    output:
      symbol: phi
      unit: "weber"
    expression: "B * A"

  power_factor_from_r_z:
    topic: DDT
    description: "Power factor of an RLC circuit from resistance R and total impedance Z: cosφ = R/Z"
    inputs:
      R: { unit: "ohm", aliases: ["resistance"] }
      Z: { unit: "ohm", aliases: ["impedance", "total_impedance"] }
    output:
      symbol: cos_phi
      unit: "dimensionless"
    expression: "R / Z"

  inductance_for_resonance:
    topic: CH
    description: "Inductance needed for an LC circuit to resonate at frequency f: L = 1/(C·(2π·f)²)"
    inputs:
      C: { unit: "farad", aliases: ["capacitance"] }
      f: { unit: "hertz", aliases: ["frequency", "resonant_frequency", "f0"] }
    output:
      symbol: L
      unit: "henry"
    expression: "1/(C*(2*pi*f)**2)"

  electric_field_from_force:
    topic: DT
    description: "Electric field magnitude at a point from the force on a test charge: E = F/q"
    inputs:
      F: { unit: "newton",  aliases: ["force"] }
      q: { unit: "coulomb", aliases: ["test_charge", "charge", "q_test"] }
    output:
      symbol: E
      unit: "volt/meter"
    expression: "F / Abs(q)"

  inductance_from_inductor_energy:
    topic: NL
    description: "Inductance from stored magnetic energy and current: L = 2·W/I²"
    inputs:
      W: { unit: "joule",  aliases: ["energy", "magnetic_energy", "E"] }
      I: { unit: "ampere", aliases: ["current"] }
    output:
      symbol: L
      unit: "henry"
    expression: "2*W/I**2"

  current_from_voltage_impedance:
    topic: CH
    description: "RMS current in an RLC series from voltage and impedance: I = U/Z"
    inputs:
      U: { unit: "volt", aliases: ["voltage", "V", "rms_voltage"] }
      Z: { unit: "ohm",  aliases: ["impedance", "total_impedance"] }
    output:
      symbol: I
      unit: "ampere"
    expression: "U / Z"

  parallel_plate_capacitance:
    topic: TD
    description: "Capacitance of an air parallel-plate capacitor: C = ε₀·A/d (vacuum permittivity 8.854e-12 F/m)"
    inputs:
      A: { unit: "meter ** 2", aliases: ["area", "plate_area", "S"] }
      d: { unit: "meter",      aliases: ["separation", "plate_separation", "distance", "gap"] }
    output:
      symbol: C
      unit: "farad"
    expression: "8.8541878128e-12 * A / d"

  parallel_plate_capacitance_dielectric:
    topic: TD
    description: "Capacitance of a parallel-plate capacitor with a dielectric of relative permittivity ε_r: C = ε₀·ε_r·A/d"
    inputs:
      A:        { unit: "meter ** 2",   aliases: ["area", "plate_area", "S"] }
      d:        { unit: "meter",        aliases: ["separation", "plate_separation", "distance", "gap"] }
      epsilon_r: { unit: "dimensionless", aliases: ["er", "k", "dielectric_constant", "relative_permittivity"] }
    output:
      symbol: C
      unit: "farad"
    expression: "8.8541878128e-12 * epsilon_r * A / d"

  dielectric_constant_from_capacitance:
    topic: TD
    description: "Iter-1 (Day-25): solve relative permittivity ε_r from C, A, d (inverse of parallel_plate_capacitance_dielectric): ε_r = C·d/(ε₀·A)"
    inputs:
      C: { unit: "farad",     aliases: ["capacitance"] }
      A: { unit: "meter ** 2", aliases: ["area", "plate_area", "S"] }
      d: { unit: "meter",     aliases: ["separation", "plate_separation", "distance", "gap"] }
    output:
      symbol: epsilon_r
      unit: "dimensionless"
    expression: "C * d / (8.8541878128e-12 * A)"

  coulomb_force_on_charge_between_two_identical:
    topic: LD
    description: "Iter-1 (Day-25 LD025): net Coulomb force on a charge q3 located on the line segment between two identical same-sign source charges (q1 = q2 = q), at distance r1 from q1 (so r2 = AB - r1 from q2). Forces point in opposite directions and the net magnitude is k·|q3·q|·|1/r1² − 1/r2²|."
    inputs:
      q:  { unit: "coulomb", aliases: ["q1", "q2", "source_charge", "charge"] }
      q3: { unit: "coulomb", aliases: ["test_charge", "q_test"] }
      r1: { unit: "meter",   aliases: ["distance_from_q1", "distance"] }
      r2: { unit: "meter",   aliases: ["distance_from_q2", "AB_minus_r1"] }
    output:
      symbol: F
      unit: "newton"
    expression: "8.9875517923e9 * Abs(q3*q) * Abs(1/r1**2 - 1/r2**2)"

  voltage_capacitor_distance_ratio:
    topic: TD
    description: "Iter-3 (Day-25 TD010): a capacitor connected to source at V1, then disconnected (charge Q conserved), then plate distance changes by factor `ratio` = d2/d1. Because Q = C·V and C ∝ 1/d, V scales linearly with d when disconnected: V2 = V1 · ratio. Ratio is dimensionless (2 for 'doubled', 3 for 'tripled', 0.5 for 'halved')."
    inputs:
      V1:    { unit: "volt",          aliases: ["initial_voltage", "source_voltage", "U1"] }
      ratio: { unit: "dimensionless", aliases: ["distance_ratio", "k"] }
    output:
      symbol: V2
      unit: "volt"
    expression: "V1 * ratio"

  ohm_law_current:
    topic: CH
    description: "Iter-3 (Day-25 THCB070): I = U/R from voltage and resistance on a single resistor (or what remains after a switch/component is removed). Distinct from current_from_voltage_impedance which keys on RLC impedance Z."
    inputs:
      U: { unit: "volt", aliases: ["voltage", "V", "potential_difference"] }
      R: { unit: "ohm",  aliases: ["resistance"] }
    output:
      symbol: I
      unit: "ampere"
    expression: "U / R"

  passthrough_current_from_remaining:
    topic: THCB
    description: "Iter-3 (Day-25 THCB070): the official question gives the remaining lamp's current directly ('lamp D2 draws 0.5 A'); after the other lamp is removed the total current equals that remaining value. The formula is a pass-through identity that returns I_remaining unchanged. Routing keys on state-change wording ('is removed' / 'if lamp Dx')."
    inputs:
      I_remaining: { unit: "ampere", aliases: ["I", "draws", "remaining_current"] }
    output:
      symbol: I_total_new
      unit: "ampere"
    expression: "I_remaining"

  coulomb_force_collinear_opposite_signs:
    topic: LD
    description: "Iter-2 (Day-25 LD026): net Coulomb force on q3 between two OPPOSITE-sign source charges q1 at A and q2 at B (q1·q2 < 0), where C is between A and B with CA = r1 and CB = r2. The two source forces on q3 point in the SAME direction (one repels, the other attracts), so they ADD: F = k·|q3|·(|q1|/r1² + |q2|/r2²)."
    inputs:
      q1: { unit: "coulomb", aliases: ["charge1", "source1"] }
      q2: { unit: "coulomb", aliases: ["charge2", "source2"] }
      q3: { unit: "coulomb", aliases: ["test_charge", "q_test"] }
      r1: { unit: "meter",   aliases: ["CA", "distance_from_q1"] }
      r2: { unit: "meter",   aliases: ["CB", "distance_from_q2"] }
    output:
      symbol: F
      unit: "newton"
    expression: "8.9875517923e9 * Abs(q3) * (Abs(q1)/r1**2 + Abs(q2)/r2**2)"

  coulomb_force_two_opposite_sources_isoceles_apex:
    topic: DT
    description: "Iter-1 (Day-25 DT005): force on test charge q3 at apex C of an isoceles triangle ABC (AC = BC = r) where A and B carry opposite-sign equal-magnitude source charges (q1 at A, −q1 at B) separated by AB = d. Both source-field components along AB add; component perpendicular cancels. Net: F = k·|q1·q3|·d/r³."
    inputs:
      q1: { unit: "coulomb", aliases: ["q", "source_charge", "charge"] }
      q3: { unit: "coulomb", aliases: ["test_charge", "q_test"] }
      d:  { unit: "meter",   aliases: ["AB", "separation"] }
      r:  { unit: "meter",   aliases: ["AC", "BC", "side", "equal_distance"] }
    output:
      symbol: F
      unit: "newton"
    expression: "8.9875517923e9 * Abs(q1*q3) * d / r**3"

  coulomb_force_two_sources_right_triangle_apex:
    topic: DT
    description: "Iter-1 (Day-25 DT006): force on test charge q3 at apex C of a RIGHT triangle ABC (right angle at C: AC² + BC² = AB²) with sources q1 at A and q2 at B. The two source-fields at C are perpendicular, so |F_net| = |q3|·√((k|q1|/AC²)² + (k|q2|/BC²)²)."
    inputs:
      q1: { unit: "coulomb", aliases: ["source1", "charge1"] }
      q2: { unit: "coulomb", aliases: ["source2", "charge2"] }
      q3: { unit: "coulomb", aliases: ["test_charge", "q_test"] }
      AC: { unit: "meter",   aliases: ["distance_AC", "rA"] }
      BC: { unit: "meter",   aliases: ["distance_BC", "rB"] }
    output:
      symbol: F
      unit: "newton"
    expression: "Abs(q3) * sqrt((8.9875517923e9 * Abs(q1) / AC**2)**2 + (8.9875517923e9 * Abs(q2) / BC**2)**2)"

  coulomb_force_equilateral_three_identical:
    topic: LD
    description: "Net Coulomb force on any one of three identical charges at the vertices of an equilateral triangle with side a: F = sqrt(3)·k·|q|²/a² (two equal sources at 60° → resultant magnitude F·√3 where F is the pairwise force)"
    inputs:
      q: { unit: "coulomb", aliases: ["q1", "q2", "q3", "charge"] }
      a: { unit: "meter",   aliases: ["side", "side_length", "distance", "d"] }
    output:
      symbol: F
      unit: "newton"
    expression: "sqrt(3) * 8.9875517923e9 * q**2 / a**2"

  coulomb_force_perp_bisector:
    topic: LD
    description: "Force on test charge q on the perpendicular bisector of a dipole (±q1, separation d), distance h from the midpoint: F = k|q1·q|·d/((d/2)²+h²)^1.5"
    inputs:
      q1: { unit: "coulomb", aliases: ["charge", "source_charge"] }
      q:  { unit: "coulomb", aliases: ["test_charge", "q_test", "q0"] }
      d:  { unit: "meter",   aliases: ["separation", "AB"] }
      h:  { unit: "meter",   aliases: ["distance", "bisector_distance", "l"] }
    output:
      symbol: F
      unit: "newton"
    expression: "8.9875517923e9 * Abs(q1*q) * d / ((d/2)**2 + h**2)**1.5"

  # Iter-6 Tier 1 — 5 audit-driven formulas closing the no_formula_matched cluster.

  # CH371/372/373/374: RLC series quality factor Q = (1/R)·sqrt(L/C). Verified
  # <0.18% rel error against all four gold answers.
  quality_factor_q:
    topic: CH
    description: "RLC series circuit quality factor: Q = (1/R)*sqrt(L/C)"
    inputs:
      L: { unit: "henry", aliases: ["inductance"] }
      C: { unit: "farad", aliases: ["capacitance"] }
      R: { unit: "ohm",   aliases: ["resistance"] }
    output:
      symbol: Q
      unit: "dimensionless"
    expression: "(1/R) * sqrt(L/C)"

  # DDT345: Capacitive reactance X_C = 1/(2πfC). Verified 0.01% on gold 35.37 Ω.
  capacitive_reactance:
    topic: DDT
    description: "Capacitive reactance: X_C = 1/(2*pi*f*C)"
    inputs:
      f: { unit: "hertz", aliases: ["frequency"] }
      C: { unit: "farad", aliases: ["capacitance"] }
    output:
      symbol: X_C
      unit: "ohm"
    expression: "1 / (2 * pi * f * C)"

  # DDT362: Natural period of an LC oscillator T = 2π·sqrt(LC). Verified 0.15%.
  natural_period_lc:
    topic: DDT
    description: "LC circuit natural oscillation period: T = 2*pi*sqrt(L*C)"
    inputs:
      L: { unit: "henry", aliases: ["inductance"] }
      C: { unit: "farad", aliases: ["capacitance"] }
    output:
      symbol: T
      unit: "second"
    expression: "2 * pi * sqrt(L * C)"

  # DDT384: Total flux linkage through N-turn coil: Psi = N * Phi. Verified 0.00%.
  total_flux_linkage:
    topic: DDT
    description: "Total flux linkage through an N-turn coil: Psi = N * Phi"
    inputs:
      N:   { unit: "dimensionless", aliases: ["turns", "n_turns", "num_turns"] }
      Phi: { unit: "weber",         aliases: ["flux", "magnetic_flux", "phi"] }
    output:
      symbol: Psi
      unit: "weber"
    expression: "N * Phi"

  # NL092: Energy-loss percentage between two LC states: %loss = (W_i-W_f)/W_i*100.
  # Verified 0.00% on (1.6 mJ -> 0.4 mJ = 75%).
  energy_loss_percent:
    topic: NL
    description: "Percentage energy loss: %loss = (W_initial - W_final) / W_initial * 100"
    inputs:
      W_initial: { unit: "joule", aliases: ["W_i", "initial_energy", "W0", "W_0"] }
      W_final:   { unit: "joule", aliases: ["W_f", "final_energy",   "W"] }
    output:
      symbol: percent_loss
      unit: "dimensionless"
    expression: "(W_initial - W_final) / W_initial * 100"

  # Iter-7 Tier-1 — 5 audit-driven formulas closing additional missing_input clusters.

  # NL346: "energy stored 0.1 J, voltage 100 V, find charge". Q = 2W/U from W=½QU.
  charge_from_energy_voltage:
    topic: NL
    description: "Charge on a capacitor from its stored energy and voltage: Q = 2*W/U"
    inputs:
      W: { unit: "joule", aliases: ["energy", "stored_energy", "electric_field_energy"] }
      U: { unit: "volt",  aliases: ["voltage", "V"] }
    output:
      symbol: Q
      unit: "coulomb"
    expression: "2 * W / U"

  # CH169: "RMS U=112V, R=75, at resonance, max power". At resonance Z=R so P_max = U²/R.
  power_at_resonance_max:
    topic: CH
    description: "Maximum power in a series RLC at resonance (Z=R): P_max = U^2 / R"
    inputs:
      U: { unit: "volt", aliases: ["voltage", "rms_voltage"] }
      R: { unit: "ohm",  aliases: ["resistance"] }
    output:
      symbol: P
      unit: "watt"
    expression: "U**2 / R"

  # DDT339: "RLC, Z=50, R=30, U=150V, power consumed". P = U²·R/Z² (= P_max·cos²φ form).
  power_from_voltage_impedance_r:
    topic: DDT
    description: "Active power in series RLC given U, R, Z: P = U^2 * R / Z^2"
    inputs:
      U: { unit: "volt", aliases: ["voltage", "rms_voltage", "source_voltage"] }
      R: { unit: "ohm",  aliases: ["resistance"] }
      Z: { unit: "ohm",  aliases: ["impedance"] }
    output:
      symbol: P
      unit: "watt"
    expression: "U**2 * R / Z**2"

  # CH365: "U=120, R=40, L=0.10, C=50uF at resonance, find U_L". At resonance,
  # omega = 1/sqrt(LC) -> X_L = omega·L = sqrt(L/C). U_L = X_L·I = X_L·U/R = U·sqrt(L/C)/R.
  voltage_inductor_at_resonance:
    topic: CH
    description: "Voltage across L in a series RLC at resonance: U_L = U*sqrt(L/C)/R"
    inputs:
      U: { unit: "volt",  aliases: ["voltage", "rms_voltage", "source_voltage"] }
      R: { unit: "ohm",   aliases: ["resistance"] }
      L: { unit: "henry", aliases: ["inductance"] }
      C: { unit: "farad", aliases: ["capacitance"] }
    output:
      symbol: U_L
      unit: "volt"
    expression: "U * sqrt(L/C) / R"

  # NL340: "LC with W_total=0.5 J, W_L=0.3 J, find W_C". Conservation: W_C = W_total - W_L.
  lc_partition_electric_energy:
    topic: NL
    description: "LC oscillator energy partition (conservation): W_C = W_total - W_L"
    inputs:
      W_total: { unit: "joule", aliases: ["total_energy", "W_tot", "W"] }
      W_L:     { unit: "joule", aliases: ["magnetic_energy", "W_M", "W_magnetic"] }
    output:
      symbol: W_C
      unit: "joule"
    expression: "W_total - W_L"
