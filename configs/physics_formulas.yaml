# Formula registry for the physics solver.
# Each entry is consumed by exact_agent.physics.formula_library.FormulaLibrary.
# `inputs` and `output` declare the symbols & SI base units the solver will
# canonicalize to via pint before substitution. `expression` is parsed by SymPy.

formulas:
  capacitor_energy:
    topic: TD
    description: "Energy stored in a capacitor: E = 0.5·C·U²"
    inputs:
      C: { unit: "farad", aliases: ["capacitance"] }
      U: { unit: "volt",  aliases: ["voltage", "V"] }
    output:
      symbol: E
      unit: "joule"
    expression: "0.5 * C * U**2"

  capacitance_from_charge:
    topic: TD
    description: "Capacitance from charge and voltage: C = Q/U"
    inputs:
      Q: { unit: "coulomb", aliases: ["charge"] }
      U: { unit: "volt",    aliases: ["voltage", "V"] }
    output:
      symbol: C
      unit: "farad"
    expression: "Q / U"

  charge_from_capacitance:
    topic: TD
    description: "Charge on a capacitor: Q = C·U"
    inputs:
      C: { unit: "farad", aliases: ["capacitance"] }
      U: { unit: "volt",  aliases: ["voltage", "V"] }
    output:
      symbol: Q
      unit: "coulomb"
    expression: "C * U"

  voltage_from_energy_capacitance:
    topic: NL
    description: "Voltage of a capacitor from energy and capacitance: U = sqrt(2W/C)"
    inputs:
      W: { unit: "joule", aliases: ["energy", "E"] }
      C: { unit: "farad", aliases: ["capacitance"] }
    output:
      symbol: U
      unit: "volt"
    expression: "sqrt(2 * W / C)"

  capacitance_from_energy_voltage:
    topic: NL
    description: "Capacitance from stored energy and voltage: C = 2W/U^2"
    inputs:
      W: { unit: "joule", aliases: ["energy", "E"] }
      U: { unit: "volt",  aliases: ["voltage", "V"] }
    output:
      symbol: C
      unit: "farad"
    expression: "2 * W / U**2"

  coulomb_force:
    topic: LD
    description: "Coulomb force between two point charges: F = k·|q1·q2|/r²"
    inputs:
      q1: { unit: "coulomb" }
      q2: { unit: "coulomb" }
      r:  { unit: "meter",   aliases: ["distance", "d"] }
    output:
      symbol: F
      unit: "newton"
    expression: "8.9875517923e9 * Abs(q1*q2) / r**2"

  electric_field_point_charge:
    topic: DT
    description: "Electric field of a point charge: E = k·q/r²"
    inputs:
      q: { unit: "coulomb" }
      r: { unit: "meter",   aliases: ["distance"] }
    output:
      symbol: E
      unit: "volt/meter"
    expression: "8.9875517923e9 * q / r**2"

  ohm_law_voltage:
    topic: CH
    description: "Ohm's law: V = I·R"
    inputs:
      I: { unit: "ampere",  aliases: ["current"] }
      R: { unit: "ohm",     aliases: ["resistance"] }
    output:
      symbol: V
      unit: "volt"
    expression: "I * R"

  power_voltage_current:
    topic: NL
    description: "Electric power: P = U·I"
    inputs:
      U: { unit: "volt",   aliases: ["voltage", "V"] }
      I: { unit: "ampere", aliases: ["current"] }
    output:
      symbol: P
      unit: "watt"
    expression: "U * I"

  power_i2r:
    topic: NL
    description: "Joule heating: P = I²·R"
    inputs:
      I: { unit: "ampere",  aliases: ["current"] }
      R: { unit: "ohm",     aliases: ["resistance"] }
    output:
      symbol: P
      unit: "watt"
    expression: "I**2 * R"

  series_resistance_two:
    topic: CH
    description: "Two resistors in series: R = R1 + R2"
    inputs:
      R1: { unit: "ohm" }
      R2: { unit: "ohm" }
    output:
      symbol: R
      unit: "ohm"
    expression: "R1 + R2"

  parallel_resistance_two:
    topic: CH
    description: "Two resistors in parallel: 1/R = 1/R1 + 1/R2"
    inputs:
      R1: { unit: "ohm" }
      R2: { unit: "ohm" }
    output:
      symbol: R
      unit: "ohm"
    expression: "(R1 * R2) / (R1 + R2)"

  rlc_impedance:
    topic: CHLT
    description: "Series RLC impedance: Z = sqrt(R² + (X_L − X_C)²)"
    inputs:
      R:   { unit: "ohm" }
      X_L: { unit: "ohm",   aliases: ["XL"] }
      X_C: { unit: "ohm",   aliases: ["XC"] }
    output:
      symbol: Z
      unit: "ohm"
    expression: "sqrt(R**2 + (X_L - X_C)**2)"

  resonance_frequency:
    topic: CHLT
    description: "Resonance frequency of LC circuit: f0 = 1 / (2π·sqrt(LC))"
    inputs:
      L: { unit: "henry" }
      C: { unit: "farad" }
    output:
      symbol: f
      unit: "hertz"
    expression: "1 / (2 * pi * sqrt(L * C))"

  magnetic_field_solenoid:
    topic: DDT
    description: "Magnetic field inside a long solenoid: B = μ0·n·I"
    inputs:
      n: { unit: "1/meter", aliases: ["turns_per_meter"] }
      I: { unit: "ampere",  aliases: ["current"] }
    output:
      symbol: B
      unit: "tesla"
    expression: "1.25663706212e-6 * n * I"

  magnetic_field_long_wire:
    topic: DDT
    description: "Magnetic field around a long straight wire: B = μ0·I / (2π·r)"
    inputs:
      I: { unit: "ampere", aliases: ["current"] }
      r: { unit: "meter",  aliases: ["distance"] }
    output:
      symbol: B
      unit: "tesla"
    expression: "1.25663706212e-6 * I / (2 * pi * r)"

  resultant_two_forces:
    topic: LD
    description: "Resultant of two forces at an angle (law of cosines): R = sqrt(F1² + F2² + 2·F1·F2·cosθ)"
    inputs:
      F1:    { unit: "newton", aliases: ["force1", "first_force"] }
      F2:    { unit: "newton", aliases: ["force2", "second_force"] }
      theta: { unit: "degree", aliases: ["angle", "angle_between"] }
    output:
      symbol: R
      unit: "newton"
    expression: "sqrt(F1**2 + F2**2 + 2*F1*F2*cos(theta*pi/180))"

  capacitance_for_resonance:
    topic: CH
    description: "Capacitance needed for an LC circuit to resonate at frequency f: C = 1/(L·(2π·f)²)"
    inputs:
      L: { unit: "henry", aliases: ["inductance"] }
      f: { unit: "hertz", aliases: ["frequency", "resonant_frequency"] }
    output:
      symbol: C
      unit: "farad"
    expression: "1/(L*(2*pi*f)**2)"

  resonance_frequency_factor:
    topic: CH
    description: "Factor k to scale ω0 so a series RLC reaches resonance: k = sqrt(X_C/X_L)"
    inputs:
      X_L: { unit: "ohm", aliases: ["XL", "inductive_reactance"] }
      X_C: { unit: "ohm", aliases: ["XC", "capacitive_reactance"] }
    output:
      symbol: k
      unit: "dimensionless"
    expression: "sqrt(X_C/X_L)"

  resistance_at_resonance:
    topic: CH
    description: "At resonance X_L = X_C so impedance equals the pure resistance: R = Z"
    inputs:
      Z: { unit: "ohm", aliases: ["impedance"] }
    output:
      symbol: R
      unit: "ohm"
    expression: "Z"

  power_at_resonance:
    topic: CH
    description: "Power of a series RLC at resonance (Z = R): P = U²/R"
    inputs:
      U: { unit: "volt", aliases: ["voltage", "V", "rms_voltage"] }
      R: { unit: "ohm",  aliases: ["resistance"] }
    output:
      symbol: P
      unit: "watt"
    expression: "U**2/R"

  relative_error_percent:
    topic: THCB
    description: "Percentage relative error: (Δ/value)·100"
    inputs:
      delta: { unit: "dimensionless", aliases: ["absolute_error", "uncertainty", "least_count"] }
      value: { unit: "dimensionless", aliases: ["measured_value", "reading"] }
    output:
      symbol: e
      unit: "%"
    expression: "(delta/value)*100"

  current_from_inductor_energy:
    topic: NL
    description: "Current in an inductor from stored magnetic energy: I = sqrt(2·W/L)"
    inputs:
      W: { unit: "joule", aliases: ["energy", "magnetic_energy", "E"] }
      L: { unit: "henry", aliases: ["inductance"] }
    output:
      symbol: I
      unit: "ampere"
    expression: "sqrt(2*W/L)"
