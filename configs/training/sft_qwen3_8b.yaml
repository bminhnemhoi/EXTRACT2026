# Supervised fine-tuning of Qwen3-8B with QLoRA via Unsloth.
# This config is consumed by `python -m exact_agent.train.run_sft_qwen`.

base_model: "Qwen/Qwen3-8B"
# Run `python -m exact_agent.train.prepare_sft` first to materialize this file.
dataset_path: "data/processed/sft_chat_train.jsonl"
val_split: 0.1
seed: 42

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  output_dir: "outputs/sft_qwen3_8b"
  num_train_epochs: 2
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  bf16: true
  packing: true
  max_seq_length: 2048

reporting:
  use_wandb: false
  wandb_project: "exact2026"
