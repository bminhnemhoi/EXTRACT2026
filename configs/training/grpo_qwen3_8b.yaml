# GRPO fine-tuning. Only run AFTER baseline + SFT are stable.
# Consumed by `python -m exact_agent.train.run_grpo`.

base_model: "Qwen/Qwen3-8B"
sft_adapter_path: "outputs/sft_qwen3_8b/checkpoint-best"
dataset_path: "data/cleaned/sft_train_mixed_solver_clean.jsonl"
seed: 42

reward_weights:
  physics:
    answer_correct: 0.40
    unit_correct: 0.20
    formula_grounded: 0.15
    explanation_grounded: 0.10
    json_format_valid: 0.10
    qwen_scope_signal: 0.05
  logic:
    solver_answer_match: 0.35
    premise_selection_match: 0.20
    proof_consistency: 0.20
    no_hallucinated_premise: 0.10
    json_format_valid: 0.10
    qwen_scope_signal: 0.05

training:
  output_dir: "outputs/grpo_qwen3_8b"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 5.0e-6
  num_generations: 4
  max_prompt_length: 1024
  max_completion_length: 1024
  beta: 0.04
  logging_steps: 5
  save_steps: 50
  bf16: true
