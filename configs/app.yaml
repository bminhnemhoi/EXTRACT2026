# FastAPI application configuration.
# Loaded by exact_agent.config.Settings (pydantic-settings). Env vars override.

api:
  host: 0.0.0.0
  port: 8000
  request_timeout_s: 30
  cors_origins:
    - "*"

logging:
  level: INFO
  json: true
  include_request_id: true

router:
  # Heuristic: presence of `premises-NL` (or `premises_NL`) routes to logic.
  premises_keys: ["premises-NL", "premises_NL", "premises"]

pipelines:
  logic:
    use_z3_fallback: true
    z3_timeout_ms: 8000
    forward_chain_max_iters: 50
    top_k_premises: 8
  physics:
    numeric_tolerance_rel: 0.01
    use_solver_first: true
    fallback_to_llm: true
    # E6 (Day-22): N independent LLM extractions, majority-vote per
    # symbol (Slide 28 endorsed). 1 = single-shot (legacy). 3 = vote.
    # Trade: N× latency. With qwen2.5:3b @ ~700ms, N=3 ~= 2.1s/call
    # for rows that miss the regex — still ≪ 60s/req cap.
    llm_self_consistency_n: 3
    # E8 (Day-22): TF-IDF-retrieved solved training rows injected as
    # few-shot demos in the extractor prompt (Slide 28 endorsed RAG).
    # 0 = zero-shot (legacy). 3 = retrieve top-3 most similar trained
    # solutions and demonstrate the extraction pattern.
    rag_examples_n: 3

self_correction:
  # Default OFF: keeps tests/CI deterministic and the API LLM-free unless a
  # local/remote endpoint is intended. Verified working Day 8 (live smoke
  # 5/5 with it ON). Production / submission flips this to true once a
  # vLLM endpoint with the SFT'd adapter is wired (see ADR 0008).
  enabled: false
  max_rounds: 2
