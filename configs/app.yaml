# FastAPI application configuration.
# Loaded by exact_agent.config.Settings (pydantic-settings). Env vars override.

api:
  host: 0.0.0.0
  port: 8000
  request_timeout_s: 30
  cors_origins:
    - "*"

logging:
  level: INFO
  json: true
  include_request_id: true

router:
  # Heuristic: presence of `premises-NL` (or `premises_NL`) routes to logic.
  premises_keys: ["premises-NL", "premises_NL", "premises"]

pipelines:
  logic:
    use_z3_fallback: true
    z3_timeout_ms: 8000
    forward_chain_max_iters: 50
    top_k_premises: 8
  physics:
    numeric_tolerance_rel: 0.01
    use_solver_first: true
    fallback_to_llm: true

self_correction:
  # Default OFF: keeps tests/CI deterministic and the API LLM-free unless a
  # local/remote endpoint is intended. Verified working Day 8 (live smoke
  # 5/5 with it ON). Production / submission flips this to true once a
  # vLLM endpoint with the SFT'd adapter is wired (see ADR 0008).
  enabled: false
  max_rounds: 2
